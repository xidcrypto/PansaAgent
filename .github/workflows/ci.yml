name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run
      - name: Verify package contents
        run: |
          CONTENTS=$(npm pack --dry-run 2>&1 | grep -E '^\s+(dist|skills|prompts|README|LICENSE|package\.json)')
          echo "$CONTENTS"
          echo "$CONTENTS" | grep -q "dist/" || exit 1
          echo "$CONTENTS" | grep -q "skills/" || exit 1
          echo "$CONTENTS" | grep -q "prompts/" || exit 1

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned official action (major version) instead of downloading an
      # unpinned "latest" binary without a checksum (D12).
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
